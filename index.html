
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pupii | Support My Music</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #111116;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .shop {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      font-size: 58px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 42px;
      margin: 10px 0;
      letter-spacing: 5px;
    }

    .subtitle {
      color: #b8b5c6;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .donation {
      background: #1d1d26;
      border: 1px solid #393943;
      border-radius: 18px;
      padding: 24px;
      margin: 16px 0;
    }

    .donation h2 {
      font-size: 32px;
      margin: 0 0 10px;
    }

    .donation p {
      color: #c1bfce;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      background: #a88aff;
      color: #171020;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    button:hover {
      background: #c0adff;
      transform: translateY(-2px);
    }

    .note {
      font-size: 12px;
      color: #898795;
      line-height: 1.6;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <main class="shop">
    <div class="logo">🎸</div>
    <h1>PUPII</h1>
    <p class="subtitle">
      indie rock made with love.<br>
      Thanks for supporting my music 🖤
    </p>

    <section class="donation">
      <h2>$5</h2>
      <p>A little support for my music ✨</p>
      <button onclick="donate(5)">Donate $5</button>
    </section>

    <section class="donation">
      <h2>$10</h2>
      <p>Extra love for indie rock 💜</p>
      <button onclick="donate(10)">Donate $10</button>
    </section>

    <p class="note">
      Made with 🖤 by Pupii<br>
      Independent music, supported by you.
    </p>
  </main>

  <script>
    function donate(amount) {
      alert(
        "Thanks for supporting Pupii! 🎸\n\n" +
        "You selected a $" + amount +
        " donation.\n\n" +
        "Online payments aren't set up yet."
      );
    }
  </script>
</body>
</html>
